version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:5050/api}
    platform: linux/amd64
    image: share-bill-frontend
    ports:
      - "3000:3000"
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    platform: linux/amd64
    env_file:
      - ./backend/.env
    environment:
      PORT: 5050
    image: share-bill-backend
    ports:
      - "5050:5050"
    restart: unless-stopped
